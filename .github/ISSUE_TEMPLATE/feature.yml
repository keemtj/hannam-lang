name: 기능 제안
description: CLI 옵션, 플러그인, 에러 메시지, 도구 개선처럼 밈 키워드가 아닌 기능 제안
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        새 밈 키워드를 제안하려면 이 양식 대신 **새 밈 제안** 양식을 써 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편이 있나요?
      description: 지금 무엇을 하려다 어디에서 막히는지
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 명령 예시, 설정 예시, 기대하는 출력 등
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
      description: 지금 쓰고 있는 우회 방법이나 검토했다가 뺀 안

  - type: checkboxes
    id: principles
    attributes:
      label: 설계 원칙 확인
      options:
        - label: "`docs/hannam-lang-syntax.md`의 설계 원칙(JS 상위 호환, 플랫폼 API는 JS 그대로)과 어긋나지 않는지 확인했어요"
          required: true
