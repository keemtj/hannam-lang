name: 새 밈 제안
description: 새 밈 키워드(문법 설탕)를 제안할 때
labels: [new-meme]
body:
  - type: markdown
    attributes:
      value: |
        제안하기 전에 `CONTRIBUTING.md`의 "새 밈 제안 기준"을 읽어 주세요.
        명세(`docs/hannam-lang-syntax.md`)의 "다음 버전 후보"에 이미 있는 항목이면 그 항목 번호나 문구를 함께 적어 주세요.

  - type: input
    id: meme
    attributes:
      label: 밈 형태
      description: 코드에 실제로 쓰는 글자 그대로 (점·물음표·물결·띄어쓰기 개수까지 정확히)
      placeholder: 예) 무슨 발언이세요?
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 대응하는 JS 문법
      placeholder: 예) console.log(값)
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 변환 예시 (.hn → .js)
      description: 명세처럼 .hn 코드와 바뀐 JS 코드를 짝으로 적어 주세요
      value: |
        ```
        // .hn
        ```

        ```js
        // .js
        ```
    validations:
      required: true

  - type: textarea
    id: nuance
    attributes:
      label: 뉘앙스가 역할과 맞는 이유
      description: 이 말투가 왜 이 JS 문법의 역할에 어울리는지
    validations:
      required: true

  - type: textarea
    id: conflicts
    attributes:
      label: 기존 JS 문법과 충돌 검토
      description: 같은 글자가 일반 JS(연산자, 삼항, 옵셔널 체이닝, 멤버 접근, 스프레드 등)나 기존 밈과 겹치는 경우가 없는지
    validations:
      required: true

  - type: textarea
    id: longevity
    attributes:
      label: 오래 갈 밈인가요?
      description: 얼마나 오래, 얼마나 널리 쓰인 말투인지
    validations:
      required: true

  - type: checkboxes
    id: criteria
    attributes:
      label: 채택 기준 확인
      options:
        - label: 같은 뜻의 기존 문법이 있는 별칭이 아니에요 (한 형태 = 한 문법)
          required: true
        - label: JS 기호 하나를 긴 밈으로 바꾸는 것이 아니에요 (설탕만 두고 별칭은 두지 않는다)
          required: true
        - label: 플랫폼 API(fetch, DOM 등)의 이름을 바꾸는 제안이 아니에요
          required: true
