name: 버그 신고
description: 변환 결과가 이상하거나, 에러 메시지가 틀리거나, CLI·플러그인이 잘못 동작할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        신고 고마워요. 재현할 수 있는 가장 짧은 `.hn` 코드가 있으면 가장 빨리 고칠 수 있어요.
        문법이 원래 어떻게 동작해야 하는지는 `docs/hannam-lang-syntax.md`가 기준이에요.

  - type: dropdown
    id: area
    attributes:
      label: 어디에서 생겼나요?
      options:
        - 변환기 (@hannam-lang/core)
        - CLI (hannam, hnc)
        - Vite 플러그인
        - VS Code 하이라이팅
        - Playground
        - 기타
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 재현 코드 (.hn)
      description: 문제를 재현하는 가장 짧은 코드
      render: js
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      description: 나와야 하는 JS 코드나 출력. 명세의 어느 부분을 근거로 했는지 적어 주면 좋아요
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 나온 JS 코드, 출력, 에러 메시지 전체
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전
      description: "`hannam --version` 결과나 패키지 버전, 또는 커밋 해시"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Node/Bun 버전, 패키지 매니저
      placeholder: macOS 15, Node 22.18.0, pnpm 10.29.3
