name: Release

# main에 changeset이 쌓이면 "Version Packages" PR을 만들거나 갱신한다.
# npm 배포는 기본으로 꺼져 있다. 저장소 변수 NPM_PUBLISH_ENABLED가 'true'일 때만 publish job이 돈다.
# 켜는 방법과 인증(npm trusted publishing)은 .github/RELEASING.md 참고.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {} # job마다 필요한 권한만 따로 준다

jobs:
  select-mode:
    name: 모드 고르기
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # changeset이 있으면 version, 없고 npm에 아직 없는 버전이 있으면 publish, 둘 다 아니면 none
      - name: 모드 고르기
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version Packages PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 버전 커밋을 changeset-release/* 브랜치에 push
      pull-requests: write # Version Packages PR 생성·갱신
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Version Packages PR 만들기
        uses: changesets/action/version@v2.1.2
        env:
          # @changesets/changelog-github가 커밋·PR 정보를 GitHub API에서 가져온다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: pnpm version-packages
          commit-message: "릴리스 (Release): Version Packages"
          pr-title: "릴리스 (Release): Version Packages"

  # GITHUB_TOKEN으로 만든 PR에서는 pull_request 워크플로가 돌지 않으므로 여기서 직접 부른다
  # 공개 전(배포가 꺼져 있을 때)에는 main push마다 macOS·Windows 러너를 쓰지 않도록 건너뛴다.
  # 필요하면 install-matrix 워크플로를 수동 실행(workflow_dispatch)한다
  install-matrix:
    name: 설치 매트릭스
    needs: version
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/install-matrix.yml
    with:
      ref: changeset-release/${{ github.ref_name }}

  publish:
    name: npm 배포
    needs: select-mode
    # 기본값으로는 실행되지 않는다. 저장소 변수 NPM_PUBLISH_ENABLED를 'true'로 둬야 돈다
    if: needs.select-mode.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write # git 태그와 GitHub 릴리스 생성
      id-token: write # npm trusted publishing(OIDC)과 provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # trusted publishing에는 npm 11.5.1 이상이 필요해서 npm 11이 들어 있는 Node 24를 쓴다.
          # registry-url은 주지 않는다. 주면 .npmrc에 _authToken=${NODE_AUTH_TOKEN} 줄이 생기는데,
          # 토큰이 없을 때 pnpm publish가 이 줄 때문에 OIDC로 넘어가지 못하고 ENEEDAUTH로 끝났다 (0.1.1 첫 시도)
          node-version: 24

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # npm은 OIDC 교환에 실패해도 이유를 verbose 로그로만 남기고 ENEEDAUTH로 끝난다.
      # 그래서 배포 전에 같은 교환을 직접 해 보고 결과를 남긴다. 토큰 값은 출력하지 않는다
      - name: OIDC 교환 확인
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL이 없습니다 (id-token: write 권한 확인)"
            exit 1
          fi
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "$id_token" ] || [ "$id_token" = "null" ]; then
            echo "::error::GitHub에서 ID 토큰을 받지 못했습니다"
            exit 1
          fi
          # npm trusted publisher 설정과 맞춰 볼 값들 (비밀 아님)
          node -e 'const p = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url")); console.log(JSON.stringify({ repository: p.repository, workflow_ref: p.workflow_ref, job_workflow_ref: p.job_workflow_ref, environment: p.environment, ref: p.ref, event_name: p.event_name }, null, 2))' "$id_token"
          for pkg in @hannam-lang/core hannam-lang @hannam-lang/vite-plugin; do
            enc=$(node -p 'encodeURIComponent(process.argv[1])' "$pkg")
            code=$(curl -sS -o exchange.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$enc")
            echo "$pkg: HTTP $code $(jq -c 'del(.token)' exchange.json 2>/dev/null || cat exchange.json)"
          done
          rm -f exchange.json

      - name: npm 배포
        id: publish
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm release
          # 세 패키지는 버전을 묶어 함께 내므로 패키지별 릴리스 대신 아래에서 버전당 하나만 만든다.
          # 버전 태그(hannam-lang@x.y.z 등)는 그대로 push한다
          create-github-releases: false
          push-git-tags: true
        env:
          # 인증은 trusted publishing(OIDC)만 쓴다. NODE_AUTH_TOKEN은 빈 값으로도 두지 않는다
          NPM_CONFIG_PROVENANCE: "true"
          # 실패하면 npm의 OIDC 로그까지 보이게 한다
          NPM_CONFIG_LOGLEVEL: verbose

      # 세 패키지의 CHANGELOG에서 이번 버전 절을 모아 GitHub 릴리스를 하나 만든다
      - name: GitHub 릴리스 만들기
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          version=$(node -p "JSON.parse(process.env.PUBLISHED).find((p) => p.name === 'hannam-lang').version")
          node scripts/release-notes.mjs "$version" > release-notes.md
          gh release create "hannam-lang@$version" --title "v$version" --notes-file release-notes.md --latest
